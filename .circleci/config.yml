version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Run Main Program
          command: python Main.py

  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Run Unit Tests
          command: python Test.py

workflows:
  build_and_test:
    jobs:
      - build
      - test:
          requires:
            - build